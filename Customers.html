<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QuickPOS — Customers</title>
  <link rel="stylesheet" href="Theme.css"/>
  <style>
    html, body { height: 100%; overflow: hidden; }
    .shell { display: grid; grid-template-columns: 360px 1fr; height: calc(100vh - var(--nav-h)); }
    @media (max-width: 700px) { .shell { grid-template-columns: 1fr; } .detail-col { display: none; } }

    /* LEFT */
    .list-col { display: flex; flex-direction: column; border-right: 1px solid var(--border); background: var(--surface); overflow: hidden; }
    .list-head { padding: 16px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; background: var(--surface2); }
    .list-title { font-size: 15px; font-weight: 700; }
    .list-count { font-size: 12px; color: var(--muted); }
    .add-cust-btn { margin-left: auto; }
    .search-box { padding: 12px 18px; border-bottom: 1px solid var(--border); position: relative; }
    .search-box svg { position: absolute; left: 30px; top: 50%; transform: translateY(-50%); color: var(--subtle); pointer-events: none; }
    .search-box input { width: 100%; padding: 11px 12px 11px 40px; border: 1.5px solid var(--border-hi); border-radius: var(--radius); font-family: inherit; font-size: 14px; color: var(--text); background: var(--bg); outline: none; transition: border-color .15s; }
    .search-box input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(22,163,74,.1); }
    .search-box input::placeholder { color: var(--subtle); }

    .cust-list { flex: 1; overflow-y: auto; }
    .cust-list::-webkit-scrollbar { width: 4px; }
    .cust-list::-webkit-scrollbar-thumb { background: var(--border-hi); border-radius: 4px; }

    .cust-row { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background .12s; }
    .cust-row:hover { background: var(--bg); }
    .cust-row.active { background: var(--accent-light); border-left: 3px solid var(--accent); }
    .cust-avatar { width: 40px; height: 40px; border-radius: 12px; background: var(--accent-light); border: 1.5px solid #86efac; display: grid; place-items: center; font-size: 16px; font-weight: 800; color: var(--accent-text); flex-shrink: 0; }
    .cust-info { flex: 1; min-width: 0; }
    .cust-name-lbl  { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cust-meta-lbl  { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .pts-pill { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: #fef9c3; color: #713f12; border: 1px solid #fcd34d; white-space: nowrap; }

    /* RIGHT */
    .detail-col { display: flex; flex-direction: column; background: var(--bg); overflow: hidden; }
    .detail-scroll { flex: 1; overflow-y: auto; }

    .detail-empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 12px; color: var(--muted); font-size: 14px; }
    .detail-empty-state svg { opacity: .2; }

    .cust-detail-head { background: var(--surface); border-bottom: 1px solid var(--border); padding: 22px 24px; display: flex; gap: 16px; align-items: flex-start; box-shadow: var(--shadow-sm); }
    .big-avatar { width: 54px; height: 54px; border-radius: 14px; background: var(--accent-light); border: 2px solid #86efac; display: grid; place-items: center; font-size: 20px; font-weight: 800; color: var(--accent-text); flex-shrink: 0; }
    .detail-info { flex: 1; }
    .detail-name { font-size: 20px; font-weight: 800; letter-spacing: -.02em; }
    .detail-meta { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 5px; font-size: 13px; color: var(--muted); }
    .detail-actions { display: flex; gap: 8px; }
    .icon-action { width: 36px; height: 36px; border-radius: var(--radius-sm); border: 1.5px solid var(--border-hi); background: var(--surface); display: grid; place-items: center; cursor: pointer; transition: all .15s; color: var(--muted); }
    .icon-action:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
    .icon-action.del:hover { border-color: var(--danger); color: var(--danger); background: var(--danger-light); }

    .stat-strip { display: grid; grid-template-columns: repeat(3,1fr); background: var(--surface); border-bottom: 1px solid var(--border); }
    .stat-cell { padding: 14px 18px; text-align: center; border-right: 1px solid var(--border); }
    .stat-cell:last-child { border-right: none; }
    .sc-val { font-size: 18px; font-weight: 800; color: var(--accent); }
    .sc-lbl { font-size: 11px; color: var(--muted); margin-top: 3px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }

    .history-label { padding: 12px 24px; font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; background: var(--surface2); border-bottom: 1px solid var(--border); }

    .sale-entry { padding: 14px 24px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background .12s; background: var(--surface); }
    .sale-entry:hover { background: var(--bg); }
    .sale-entry-top { display: flex; justify-content: space-between; align-items: center; }
    .sale-id-lbl   { font-size: 12px; color: var(--muted); font-weight: 500; }
    .sale-amt-lbl  { font-size: 15px; font-weight: 800; color: var(--accent); }
    .sale-date-lbl { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .sale-preview  { font-size: 12px; color: var(--muted); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pay-tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--info-light); color: #1e3a8a; border: 1px solid #93c5fd; margin-left: 8px; }
    .sale-items-exp { display: none; padding: 10px 24px 12px; background: #f9fafb; border-bottom: 1px solid var(--border); }
    .sale-items-exp.open { display: block; }
    .si-line { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; color: var(--muted); }
    .si-line span:last-child { color: var(--text); font-weight: 600; }
  </style>
</head>
<body>
<nav class="top-nav">
  <a class="nav-logo" href="Dashboard.html">Quick<span>POS</span></a>
  <span style="font-size:13px;color:var(--muted);font-weight:600">Customers</span>
  <div class="nav-right">
    <a class="nav-link hide-mobile" href="pos.html">POS</a>
    <a class="nav-link hide-mobile" href="Reports.html">Reports</a>
    <a class="nav-link hide-mobile" href="Dashboard.html">Dashboard</a>
    <button class="nav-btn danger" onclick="logout()">Sign out</button>
  </div>
</nav>

<div class="shell">
  <!-- LEFT -->
  <div class="list-col">
    <div class="list-head">
      <div><div class="list-title">Customers</div><div class="list-count" id="list-count">—</div></div>
      <button class="btn btn-primary btn-sm add-cust-btn" onclick="openModal()">+ Register</button>
    </div>
    <div class="search-box">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.5"/><path d="M11 11l2.5 2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <input type="text" id="cust-search" placeholder="Search by name or phone…" oninput="filterCusts()"/>
    </div>
    <div class="cust-list" id="cust-list">
      <div class="empty-state"><span>Loading…</span></div>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="detail-col">
    <div class="detail-scroll" id="detail-scroll">
      <div class="detail-empty-state">
        <svg width="56" height="56" viewBox="0 0 56 56" fill="none"><circle cx="28" cy="20" r="11" stroke="currentColor" stroke-width="2"/><path d="M8 48c0-11 9-20 20-20s20 9 20 20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <strong>Select a customer</strong>
        <span>to view details and purchase history</span>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<!-- Modal -->
<div class="modal-bg" id="modal">
  <div class="modal-box">
    <div class="modal-title" id="modal-title">Register customer</div>
    <div class="field"><label>Full name *</label><input class="input" type="text" id="f-name" placeholder="e.g. Kofi Mensah"/></div>
    <div class="field" style="margin-top:14px"><label>Phone</label><input class="input" type="text" id="f-phone" placeholder="e.g. 0244123456"/></div>
    <div class="field" style="margin-top:14px"><label>Email</label><input class="input" type="email" id="f-email" placeholder="e.g. kofi@email.com"/></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="modal-save" onclick="saveCustomer()">Register</button>
    </div>
  </div>
</div>

<script>
  const API = 'http://localhost:3000';
  const token = localStorage.getItem('pos_token');
  if (!token) window.location.href = 'login.html';
  const H = { 'Content-Type':'application/json','Authorization':`Bearer ${token}` };

  let allCustomers=[], selectedId=null, editingId=null, expandedSales=new Set();

  async function loadCustomers(){
    try{
      const d=await(await fetch(`${API}/customers`,{headers:H})).json();
      allCustomers=d.data||[];
      document.getElementById('list-count').textContent=`${allCustomers.length} registered`;
      renderList(allCustomers);
    }catch{ document.getElementById('cust-list').innerHTML='<div class="empty-state"><span>Could not load customers</span></div>'; }
  }

  function filterCusts(){
    const q=document.getElementById('cust-search').value.toLowerCase().trim();
    renderList(q?allCustomers.filter(c=>c.name.toLowerCase().includes(q)||(c.phone||'').includes(q)):allCustomers);
  }

  function renderList(list){
    const wrap=document.getElementById('cust-list');
    if(!list.length){wrap.innerHTML='<div class="empty-state"><span>No customers found</span></div>';return;}
    wrap.innerHTML=list.map(c=>`
      <div class="cust-row ${c.customer_id===selectedId?'active':''}" onclick="selectCust(${c.customer_id})">
        <div class="cust-avatar">${c.name.charAt(0).toUpperCase()}</div>
        <div class="cust-info">
          <div class="cust-name-lbl">${c.name}</div>
          <div class="cust-meta-lbl">${c.phone||'No phone'}${c.email?' · '+c.email:''}</div>
        </div>
        ${c.loyalty_points>0?`<span class="pts-pill">${c.loyalty_points} pts</span>`:''}
      </div>`).join('');
  }

  async function selectCust(id){
    selectedId=id;
    filterCusts();
    const c=allCustomers.find(x=>x.customer_id===id);
    if(!c) return;
    document.getElementById('detail-scroll').innerHTML='<div class="detail-empty-state"><span>Loading history…</span></div>';
    try{
      const d=await(await fetch(`${API}/customers/${id}/history`,{headers:H})).json();
      renderDetail(c,d.data.sales,d.data.total_spent,d.data.total_orders);
    }catch{ document.getElementById('detail-scroll').innerHTML='<div class="detail-empty-state"><span>Could not load history</span></div>'; }
  }

  function renderDetail(c,sales,total_spent,total_orders){
    const initials=c.name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
    document.getElementById('detail-scroll').innerHTML=`
      <div class="cust-detail-head">
        <div class="big-avatar">${initials}</div>
        <div class="detail-info">
          <div class="detail-name">${c.name}</div>
          <div class="detail-meta">
            ${c.phone?`<span>${c.phone}</span>`:''}
            ${c.email?`<span>${c.email}</span>`:''}
            <span>Since ${new Date(c.created_at).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}</span>
          </div>
        </div>
        <div class="detail-actions">
          <button class="icon-action" onclick="openModal(${c.customer_id})" title="Edit">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10.5 2.5l3 3L5 14H2v-3L10.5 2.5z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
          </button>
          <button class="icon-action del" onclick="deleteCust(${c.customer_id})" title="Delete">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 4h12M6 4V2.5h4V4M6.5 7v5M9.5 7v5M3 4l.9 9h8.2L13 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
      <div class="stat-strip">
        <div class="stat-cell"><div class="sc-val">${total_orders}</div><div class="sc-lbl">Orders</div></div>
        <div class="stat-cell"><div class="sc-val">GH₵ ${parseFloat(total_spent).toFixed(2)}</div><div class="sc-lbl">Total spent</div></div>
        <div class="stat-cell"><div class="sc-val">${c.loyalty_points||0}</div><div class="sc-lbl">Loyalty pts</div></div>
      </div>
      <div class="history-label">Purchase history</div>
      ${!sales.length?'<div class="empty-state" style="padding:40px"><span>No purchases yet</span></div>':
        sales.map(s=>`
          <div class="sale-entry" onclick="toggleSale(${s.sale_id})">
            <div class="sale-entry-top">
              <span class="sale-id-lbl">#${s.sale_id}<span class="pay-tag">${(s.payment_method||'').replace('_',' ')}</span></span>
              <span class="sale-amt-lbl">GH₵ ${parseFloat(s.total_amount).toFixed(2)}</span>
            </div>
            <div class="sale-date-lbl">${new Date(s.created_at).toLocaleString('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}</div>
            <div class="sale-preview">${s.items.map(i=>`${i.product_name} ×${i.quantity}`).join(', ')}</div>
          </div>
          <div class="sale-items-exp ${expandedSales.has(s.sale_id)?'open':''}" id="se-${s.sale_id}">
            ${s.items.map(i=>`<div class="si-line"><span>${i.product_name} × ${i.quantity} @ GH₵ ${parseFloat(i.unit_price).toFixed(2)}</span><span>GH₵ ${parseFloat(i.subtotal).toFixed(2)}</span></div>`).join('')}
          </div>`).join('')}
    `;
  }

  function toggleSale(id){
    if(expandedSales.has(id)) expandedSales.delete(id); else expandedSales.add(id);
    const el=document.getElementById(`se-${id}`);if(el)el.classList.toggle('open',expandedSales.has(id));
  }

  function openModal(id=null){
    editingId=id;
    if(id){
      const c=allCustomers.find(x=>x.customer_id===id);
      document.getElementById('f-name').value=c.name||'';document.getElementById('f-phone').value=c.phone||'';document.getElementById('f-email').value=c.email||'';
      document.getElementById('modal-title').textContent='Edit customer';document.getElementById('modal-save').textContent='Save changes';
    } else {
      document.getElementById('f-name').value='';document.getElementById('f-phone').value='';document.getElementById('f-email').value='';
      document.getElementById('modal-title').textContent='Register customer';document.getElementById('modal-save').textContent='Register';
    }
    document.getElementById('modal').classList.add('open');
  }
  function closeModal(){document.getElementById('modal').classList.remove('open');editingId=null;}

  async function saveCustomer(){
    const name=document.getElementById('f-name').value.trim();const phone=document.getElementById('f-phone').value.trim();const email=document.getElementById('f-email').value.trim();
    if(!name){toast('Name is required','error');return;}
    const body=JSON.stringify({name,phone,email});
    try{
      const res=await fetch(editingId?`${API}/customers/${editingId}`:`${API}/customers`,{method:editingId?'PUT':'POST',headers:H,body});
      const data=await res.json();
      if(!res.ok){toast(data.message||'Failed','error');return;}
      toast(editingId?'Customer updated':'Customer registered','success');
      closeModal();await loadCustomers();if(editingId) selectCust(editingId);
    }catch{toast('Cannot connect to server','error');}
  }

  async function deleteCust(id){
    if(!confirm('Delete this customer? Their sales history will be preserved.')) return;
    try{
      const res=await fetch(`${API}/customers/${id}`,{method:'DELETE',headers:H});
      const data=await res.json();
      if(!res.ok){toast(data.message||'Failed','error');return;}
      toast('Customer deleted','success');selectedId=null;
      document.getElementById('detail-scroll').innerHTML='<div class="detail-empty-state"><svg width="56" height="56" viewBox="0 0 56 56" fill="none"><circle cx="28" cy="20" r="11" stroke="currentColor" stroke-width="2"/><path d="M8 48c0-11 9-20 20-20s20 9 20 20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><strong>Select a customer</strong></div>';
      await loadCustomers();
    }catch{toast('Cannot connect to server','error');}
  }

  let tt;
  function toast(msg,type=''){const el=document.getElementById('toast');el.textContent=msg;el.className=`show ${type}`;clearTimeout(tt);tt=setTimeout(()=>el.className='',2200);}
  function logout(){localStorage.removeItem('pos_token');localStorage.removeItem('pos_user');window.location.href='login.html';}

  document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.getElementById('modal').classList.contains('open'))saveCustomer();if(e.key==='Escape')closeModal();});
  loadCustomers();
</script>
</body>
</html>
